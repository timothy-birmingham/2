<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vesta Billing Portal</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <header>

        <div class="header-left">

            <h1>Vesta Billing Portal</h1>

            <p>Create Association Billing Requests</p>

        </div>

        <div class="header-right">

            <span id="todayDate"></span>

        </div>

    </header>

    <main>

        <!-- LEFT COLUMN -->

        <section class="card">

            <h2>Billing Information</h2>

            <div class="form-group">

                <label>Office</label>

                <select id="officeSelect">

                    <option value="">Select Office</option>

                </select>

            </div>

            <div class="form-group">

                <label>Association</label>

                <select id="associationSelect" disabled>

                    <option value="">Select Association</option>

                </select>

            </div>

            <div class="form-group">

                <label>Prepared By</label>

                <select id="employeeSelect">

                    <option value="">Select Employee</option>

                </select>

            </div>

        </section>

        <!-- SERVICE ENTRY -->

        <section class="card">

            <h2>Add Billing Item</h2>

            <div class="form-group">

                <label>Service</label>

                <select id="serviceSelect">

                    <option value="">Select Service</option>

                </select>

            </div>

            <div class="service-preview">

    <div class="preview-card">

        <span class="preview-title">Unit Price</span>

        <span id="unitPrice">$0.00</span>

    </div>

    <div class="preview-card">

        <span class="preview-title">Unit</span>

        <span id="unitType">-</span>

    </div>

    <div class="preview-card">

        <span class="preview-title">Line Total</span>

        <span id="lineTotal">$0.00</span>

    </div>

</div>

            <div class="form-group">

                <label>Quantity</label>

                <input
                    type="number"
                    id="quantityInput"
                    placeholder="Enter Quantity"
                    min="1"
                    value="1">

            </div>

            <div class="form-group">

                <label>Notes</label>

                <textarea
                    id="notesInput"
                    rows="4"
                    placeholder="Enter Notes"></textarea>

            </div>

            <button id="addItemButton">

                + Add Line Item

            </button>

        </section>

        <!-- RECEIPT -->

        <section class="card">

            <div class="receipt-header">

                <h2>Billing Receipt</h2>

                <button id="clearReceipt">

                    Clear

                </button>

            </div>

            <table id="receiptTable">

                <thead>

                    <tr>
                        <th>Service</th>
                        <th>Qty</th>
                        <th>Unit</th>
                        <th>Unit Price</th>
                        <th>Line Total</th>
                        <th></th>
                    </tr>

                </thead>

                <tbody>

                </tbody>

            </table>

            <div class="receipt-total">

                Total

                <span id="receiptTotal">$0.00</span>

            </div>

            <div class="button-row">

                <button id="printButton">

                    Print

                </button>

                <button id="exportButton">

                    Export PDF

                </button>

            </div>

        </section>

    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="app.js"></script>
    
</body>

</html>
